# Docker 镜像验证（2026-08-22 起双层设计，取代「仅路径触发」旧制）：
#
# - smoke：每个 PR / main push 必跑。镜像即交付物——每个 commit 都要证明
#   「能构建 + 容器能起 + 单实例完整闭环（setup → 建实例 → warp=on Healthy）」。
#   只注册 1 个 WARP 账号，控制对 Cloudflare 的注册频率（风控约束）。
# - full：仅容器/数据面路径变更时跑全矩阵 1..=8（多实例隔离、Zero Trust 换线、
#   GOST 认证等重场景）。注册次数多，不随业务 PR 重复。
#
# Zero Trust 换线（full 的 E2E-08）可选配置 repo secrets：
#   WARP_E2E_ZT_ORG / WARP_E2E_ZT_CLIENT_ID / WARP_E2E_ZT_CLIENT_SECRET，
#   未配置时用例 8 自动走零凭据路径。

name: Docker E2E

on:
  pull_request:
  push:
    branches: [main]
  # P1 审查 R2#2：业务大改后可手动触发全矩阵，无需等容器路径变更。
  workflow_dispatch:

# detect job 的 paths-filter 在 PR 模式走 GitHub API（listFiles），需要显式授权；
# 默认 GITHUB_TOKEN 权限收紧时会报 "Resource not accessible by integration"。
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    # 工作流级不再设 paths（否则会把 smoke 也一起门掉）；改为 job 内探测。
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}
      dataplane: ${{ steps.filter.outputs.dataplane }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # 语义组 1：容器/装配本体——镜像内容物可能变化
            container:
              - 'Dockerfile'
              - 'docker/**'
              - 'compose.yml'
              - 'compose*.yml'
              - 'crates/xtask/**'
              - '.github/workflows/docker-e2e.yml'
            # 语义组 2：数据面核心（P1 审查 R1#11/R2#2）——多实例隔离、
            # 故障恢复、认证、无直连泄漏的回归保护对象。这些路径变更时
            # 同样必须跑全矩阵，而非只有单实例 smoke。
            dataplane:
              - 'crates/warpdeck-server/src/runtime/**'
              - 'crates/warpdeck-server/src/proxy/**'
              - 'crates/warpdeck-server/src/reconciler/**'
              - 'crates/warpdeck-server/migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  smoke:
    name: Docker Smoke (E2E-01)
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # 版本与仓库根 rust-toolchain.toml 保持一致（升级须同步，见该文件头注）。
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xtask
      - name: Build e2e image
        run: cargo xtask release --tag warpdeck:e2e
      - name: Single-instance closed loop
        run: cargo xtask e2e --only 1

  full:
    name: Docker E2E (L5 full matrix)
    needs: detect
    if: needs.detect.outputs.container == 'true' || needs.detect.outputs.dataplane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xtask
      - name: Build e2e image
        run: cargo xtask release --tag warpdeck:e2e
      - name: Run E2E matrix
        env:
          WARP_E2E_ZT_ORG: ${{ secrets.WARP_E2E_ZT_ORG }}
          WARP_E2E_ZT_CLIENT_ID: ${{ secrets.WARP_E2E_ZT_CLIENT_ID }}
          WARP_E2E_ZT_CLIENT_SECRET: ${{ secrets.WARP_E2E_ZT_CLIENT_SECRET }}
        run: cargo xtask e2e
